name: Publish to PyPI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      repository:
        description: "Target repository"
        type: choice
        default: testpypi
        options:
          - testpypi
          - pypi

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: pip install -e ".[dev]"
      - run: pytest tests/ --ignore=tests/e2e
      # unquoted glob: bash expands it; node < 21 does not glob on its own
      - run: node --test tests/js/*.js

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # tag push → pypi; manual run → input (default: testpypi)
          repository-url: ${{ github.event.inputs.repository || 'pypi' }}

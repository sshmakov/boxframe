{% extends "pages/base.html" %}

{% block title %}Projects — boxframe{% endblock %}

{% block content %}
<div x-data="projectsPage()">
    <!-- Hidden file input for project import (opened by the Import button) -->
    <input type="file" x-ref="importFile" accept="application/json,.json"
           class="import-file-input" style="display:none" @change="onImportFile($event)">
    <div class="flex-between mb-4">
        <h1>Projects</h1>
        <div class="flex gap-2">
            <button @click="$refs.importFile.click()" class="btn"
                    title="Import a project from a JSON file">Import</button>
            <button @click="showNew = !showNew" class="btn btn-primary">
                + New Project
            </button>
        </div>
    </div>

    <!-- New project form -->
    <div x-show="showNew" x-cloak class="card mb-4">
        <form @submit.prevent="
            fetch('/api/projects/', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({name})
            }).then(r => r.json()).then(data => {
                window.location.href = '/project/' + data.id;
            });
            showNew = false; name = '';
        ">
            <input type="text" x-model="name" placeholder="Project name..."
                   class="input" required autofocus>
            <button type="submit" class="btn btn-primary">Create</button>
        </form>
    </div>

    <!-- Projects list -->
    <div id="projects-list" class="grid">
        {% for project in projects %}
        <div class="card project-card" id="card-{{ project.id }}" data-project-name="{{ project.name }}">
            <div class="project-info">
                <template x-if="renaming !== '{{ project.id }}'">
                    <a href="/project/{{ project.id }}" class="card-link">
                        <h3>{{ project.name }}</h3>
                        <p class="text-muted">{{ project.layouts|length }} layout(s)</p>
                        <p class="text-small text-muted">Updated: {{ project.updated_at.strftime('%Y-%m-%d %H:%M') if project.updated_at else '' }}</p>
                    </a>
                </template>
                <template x-if="renaming === '{{ project.id }}'">
                    <div class="form-row">
                        <input type="text" x-model="renameValue" @keydown.enter="commitRename('{{ project.id }}')" @keydown.escape="renaming = null" class="input" x-init="$el.focus()">
                        <button @click="commitRename('{{ project.id }}')" class="btn btn-primary btn-sm">OK</button>
                        <button @click="renaming = null" class="btn btn-ghost btn-sm">✕</button>
                    </div>
                </template>
            </div>
            <div class="project-actions">
                <button @click="startRename('{{ project.id }}', $el.closest('.project-card').dataset.projectName)" class="btn btn-sm" title="Rename">✎</button>
                <button @click="duplicate('{{ project.id }}', $el.closest('.project-card').dataset.projectName)" class="btn btn-sm" title="Duplicate">⧉</button>
                <a class="btn btn-sm" href="/api/projects/{{ project.id }}/export" download title="Export to JSON">⬇</a>
                <button hx-delete="/api/projects/{{ project.id }}"
                        hx-confirm="Delete project '{{ project.name }}'?"
                        hx-target="closest .card"
                        hx-swap="delete"
                        class="btn btn-danger btn-sm" title="Delete">✕</button>
            </div>
        </div>
        {% else %}
        <div class="card empty">
            <p>No projects yet. Create one to get started!</p>
        </div>
        {% endfor %}
    </div>
</div>

<script>
function projectsPage() {
    return {
        showNew: false,
        name: '',
        renaming: null,
        renameValue: '',

        startRename(id, currentName) {
            this.renaming = id;
            this.renameValue = currentName;
        },

        commitRename(id) {
            if (!this.renameValue.trim()) { this.renaming = null; return; }
            fetch('/api/projects/' + id, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ name: this.renameValue.trim() })
            }).then(r => {
                if (r.ok) location.reload();
            });
            this.renaming = null;
        },

        duplicate(id, currentName) {
            const newName = prompt('New name for the copy:', currentName + ' (copy)');
            if (!newName) return;
            fetch('/api/projects/' + id + '/duplicate', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ name: newName })
            }).then(r => {
                if (r.ok) location.reload();
            });
        },

        // Import a project from a JSON file: parse, POST to the import
        // endpoint (fresh ids, no collisions), then open the new project.
        onImportFile(e) {
            const input = e.target;
            const file = input.files && input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => {
                input.value = ''; // allow re-importing the same file
                let data;
                try {
                    data = JSON.parse(String(reader.result));
                } catch (err) {
                    alert('Not a valid JSON file: ' + err.message);
                    return;
                }
                fetch('/api/projects/import', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                }).then(r => r.json()).then(res => {
                    if (!r.ok) { alert('Import failed: ' + (res.detail || r.status)); return; }
                    window.location.href = '/project/' + res.id;
                }).catch(err => alert('Import failed: ' + err.message));
            };
            reader.onerror = () => { input.value = ''; alert('Could not read the file.'); };
            reader.readAsText(file);
        }
    };
}
</script>
{% endblock %}

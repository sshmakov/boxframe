{% extends "pages/base.html" %}

{% block title %}{{ project.name }} — boxframe{% endblock %}

{% block content %}
<div class="project-page">
    <div class="flex-between mb-4">
        <div>
            <a href="/" class="back-link">← Projects</a>
            <h1>{{ project.name }}</h1>
        </div>
        <a class="btn" href="/api/projects/{{ project.id }}/export" download title="Export to JSON">⬇ Export</a>
    </div>

    <!-- New layout form -->
    <div x-data="{ showNew: false, name: '', width: '', height: '' }">
        <div class="flex-between mb-4">
            <button x-show="!showNew" x-cloak @click="showNew = true" class="btn btn-primary">+ New Layout</button>
        </div>
        <div x-show="showNew" x-cloak class="card mb-4">
            <form @submit.prevent="
                fetch('/api/projects/{{ project.id }}/layouts', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        name,
                        width: width === '' ? null : parseInt(width),
                        height: height === '' ? null : parseInt(height)
                    })
                }).then(r => r.json()).then(data => {
                    window.location.href = '/layout/' + data.id;
                });
                showNew = false;
            ">
                <div class="form-row">
                    <input type="text" x-model="name" placeholder="Layout name..." class="input" required>
                    <input type="number" x-model="width" placeholder="Width (optional)" class="input input-sm" min="1">
                    <input type="number" x-model="height" placeholder="Height (optional)" class="input input-sm" min="1">
                    <button type="submit" class="btn btn-primary">Create</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Layouts management -->
    <div x-data="layoutsManager('{{ project.id }}')">
        <!-- Toolbar: move selected -->
        <div x-show="selected.length > 0" x-cloak class="toolbar mb-4">
            <span class="text-muted" x-text="selected.length + ' selected'"></span>
            <button @click="showMovePanel = !showMovePanel" class="btn btn-sm">Move to project…</button>
            <button @click="selected = []" class="btn btn-sm btn-ghost">Clear</button>
        </div>
        <!-- Move panel -->
        <div x-show="showMovePanel" x-cloak class="card mb-4">
            <div class="form-row">
                <select x-model="moveTarget" class="input">
                    <option value="">Select target project…</option>
                    <template x-for="p in projects" :key="p.id">
                        <option :value="p.id" x-text="p.name" x-show="p.id !== '{{ project.id }}'"></option>
                    </template>
                </select>
                <button @click="moveSelected()" :disabled="!moveTarget" class="btn btn-primary btn-sm">Move</button>
                <button @click="showMovePanel = false" class="btn btn-ghost btn-sm">Cancel</button>
            </div>
        </div>

        <!-- Layouts list -->
        <div class="grid">
            {% for layout in project.layouts %}
            <div class="card layout-card" data-layout-id="{{ layout.id }}" data-layout-name="{{ layout.name }}">
                <label class="layout-checkbox">
                    <input type="checkbox" :value="'{{ layout.id }}'" x-model="selected">
                </label>
                <div class="layout-info">
                    <template x-if="renaming !== '{{ layout.id }}'">
                        <a href="/layout/{{ layout.id }}" class="card-link">
                            <h3>{{ layout.name }}</h3>
                            <p class="text-muted">
                                {% if layout.width is not none and layout.height is not none %}
                                {{ layout.width }}×{{ layout.height }} grid
                                {% elif layout.width is not none %}
                                width {{ layout.width }}
                                {% elif layout.height is not none %}
                                height {{ layout.height }}
                                {% else %}
                                no bounds
                                {% endif %}
                            </p>
                            <p class="text-small text-muted">Created: {{ layout.created_at.strftime('%Y-%m-%d') if layout.created_at else '' }}</p>
                        </a>
                    </template>
                    <template x-if="renaming === '{{ layout.id }}'">
                        <div class="form-row">
                            <input type="text" x-model="renameValue" @keydown.enter="commitRename('{{ layout.id }}')" @keydown.escape="renaming = null" class="input" x-init="$el.focus()">
                            <button @click="commitRename('{{ layout.id }}')" class="btn btn-primary btn-sm">OK</button>
                            <button @click="renaming = null" class="btn btn-ghost btn-sm">✕</button>
                        </div>
                    </template>
                </div>
                <div class="layout-actions">
                    <button @click="startRename('{{ layout.id }}', $el.closest('.layout-card').dataset.layoutName)" class="btn btn-sm" title="Rename">✎</button>
                    <button @click="duplicate('{{ layout.id }}', $el.closest('.layout-card').dataset.layoutName)" class="btn btn-sm" title="Duplicate">⧉</button>
                    <button hx-delete="/api/layouts/{{ layout.id }}"
                            hx-confirm="Delete layout '{{ layout.name }}'?"
                            hx-target="closest .card"
                            hx-swap="delete"
                            class="btn btn-danger btn-sm" title="Delete">✕</button>
                </div>
            </div>
            {% else %}
            <div class="card empty">
                <p>No layouts yet. Create your first mockup!</p>
            </div>
            {% endfor %}
        </div>
    </div>
</div>

<script>
function layoutsManager(projectId) {
    return {
        selected: [],
        renaming: null,
        renameValue: '',
        showMovePanel: false,
        moveTarget: '',
        projects: [],

        init() {
            fetch('/api/projects/')
                .then(r => r.json())
                .then(data => { this.projects = data; });
        },

        startRename(id, currentName) {
            this.renaming = id;
            this.renameValue = currentName;
        },

        commitRename(id) {
            if (!this.renameValue.trim()) { this.renaming = null; return; }
            fetch('/api/layouts/' + id, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ name: this.renameValue.trim() })
            }).then(r => {
                if (r.ok) location.reload();
            });
            this.renaming = null;
        },

        duplicate(id, currentName) {
            const newName = prompt('New name for the copy:', currentName + ' (copy)');
            if (!newName) return;
            fetch('/api/layouts/' + id + '/duplicate', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ name: newName })
            }).then(r => {
                if (r.ok) location.reload();
            });
        },

        moveSelected() {
            if (!this.moveTarget || this.selected.length === 0) return;
            fetch('/api/layouts/move', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    layout_ids: this.selected,
                    target_project_id: this.moveTarget
                })
            }).then(r => {
                if (r.ok) location.reload();
            });
        }
    };
}
</script>
{% endblock %}

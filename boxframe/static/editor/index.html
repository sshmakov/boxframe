<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>boxframe — static editor</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/editor.css">
</head>
<body>
<div x-data="editorApp()" x-init="init()" class="editor-root">

    <!-- Hidden file input for layout import (opened by the Import button) -->
    <input type="file" x-ref="importFile" class="import-file-input"
           accept=".json,application/json" style="display:none"
           @change="onImportFile($event)">

    <!-- Header: logo + actions (no backend — no project breadcrumbs) -->
    <header class="editor-header">
        <div class="editor-header__top">
            <span class="logo">boxframe</span>
            <div class="editor-header__actions">
                <button class="btn btn-sm import-btn" @click="$refs.importFile.click()"
                        title="Import a layout from a JSON file">Import</button>
                <div class="dropdown" x-data="{ open: false }" @click.outside="open = false">
                    <button class="btn btn-sm" @click="open = !open">Export...</button>
                    <div class="dropdown__menu" x-show="open" x-cloak>
                        <button class="dropdown__item" @click="exportAs('json'); open = false">📋 JSON</button>
                        <button class="dropdown__item" @click="exportAs('markdown'); open = false">📝 Markdown</button>
                        <button class="dropdown__item" @click="exportAs('ascii'); open = false">📄 ASCII</button>
                    </div>
                </div>
                <button class="btn btn-sm undo-btn" @click="undo()" :disabled="undoCount === 0"
                        title="Undo (Ctrl+Z)">↶</button>
                <button class="btn btn-sm redo-btn" @click="redo()" :disabled="redoCount === 0"
                        title="Redo (Ctrl+Shift+Z)">↷</button>
                <button class="btn btn-sm copy-btn" @click="copyRaw()">Copy</button>
                <button class="btn btn-sm clear-layout-btn" x-show="blocks.length > 0" x-cloak
                        @click="clearLayout()" title="Remove all blocks (asks for confirmation)">Clear</button>
            </div>
        </div>
        <nav class="editor-header__breadcrumb">
            <span class="current">static editor</span>
            <span class="sep">—</span>
            <span>no backend, layout is saved in your browser (localStorage)</span>
        </nav>
    </header>

    <!-- Body: sidebar (components + elements) + content (canvas) -->
    <div class="editor-body">
        <!-- Sidebar -->
        <aside class="editor-sidebar">
            <div class="editor-components">
                <div class="section-title">Components</div>
                <div class="palette-grid">
                    <template x-for="type in blockTypes" :key="type">
                        <button class="palette-btn"
                                @click="addBlock(type)"
                                @dragstart="onPaletteDragStart($event)"
                                @dragend="onPaletteDragEnd($event)"
                                :data-block-type="type"
                                draggable="true"
                                :title="'Drag to canvas or click to add at (1,1)'">
                            <span x-text="type"></span>
                        </button>
                    </template>
                </div>
            </div>

            <div class="editor-elements">
                <div class="section-title" x-text="'Elements (' + blocks.length + ')'"></div>
                <div class="element-list">
                    <template x-for="(block, idx) in blocks" :key="block.id">
                        <div class="block-item"
                             :class="{ 'block-item--selected': selectedIds.includes(block.id) }"
                             @click="onListItemClick($event, block.id)"
                             title="Shift/Ctrl+click — add to selection">
                            <span class="block-item__info">
                                <strong x-text="block.block_type"></strong>
                                <span class="block-item__pos" x-text="' @(' + block.x + ',' + block.y + ')'"></span>
                                <span class="block-order" x-text="'#' + block.order"></span>
                            </span>
                            <span class="block-actions">
                                <button class="order-btn" @click="moveBlockOrder(block.id, -1)" :disabled="block.order <= 0" title="Move down (lower z-index)">↓</button>
                                <button class="order-btn" @click="moveBlockOrder(block.id, 1)" :disabled="block.order >= maxOrder" title="Move up (higher z-index)">↑</button>
                                <button class="delete-block" @click="deleteBlock(block.id)" title="Delete">×</button>
                            </span>
                        </div>
                    </template>
                </div>
            </div>
        </aside>

        <!-- Content: canvas preview -->
        <section class="editor-content">
            <div class="canvas-container"
                 title="Click a block to select it, drag on empty canvas to select several (Shift — add), double-click to edit its text"
                 @dragover.prevent="onCanvasDragOver($event)"
                 @dragleave="onCanvasDragLeave($event)"
                 @drop="onCanvasDrop($event)"
                 @mousedown="onCanvasMouseDown($event)"
                 @dblclick="onCanvasDblClick($event)">
                <div class="canvas-drag-overlay"></div>
                <div x-html="htmlPreview"></div>
                <!-- Selection frame with corner resize handles: the block
                     itself for a single selection, the group's bounding box
                     for a multi-selection; block actions live in the
                     properties panel -->
                <div class="block-selection" x-show="selectedBlock && !editingBlock" x-cloak
                     :style="selectionStyle">
                    <div class="block-selection__frame"></div>
                    <div class="sel-resize sel-resize--nw" data-corner="nw"
                         @mousedown="onSelectionResizeMouseDown($event)" title="Drag to resize"></div>
                    <div class="sel-resize sel-resize--ne" data-corner="ne"
                         @mousedown="onSelectionResizeMouseDown($event)" title="Drag to resize"></div>
                    <div class="sel-resize sel-resize--sw" data-corner="sw"
                         @mousedown="onSelectionResizeMouseDown($event)" title="Drag to resize"></div>
                    <div class="sel-resize sel-resize--se" data-corner="se"
                         @mousedown="onSelectionResizeMouseDown($event)" title="Drag to resize"></div>
                </div>
                <!-- Block properties panel (floats next to the selection;
                     with several blocks selected the values apply to all) -->
                <div class="block-props" x-show="selectedBlock && !editingBlock" x-cloak
                     :style="propsPanelStyle">
                    <div class="block-props__head">
                        <span class="block-props__type" x-text="panelTitle"></span>
                        <button class="block-props__close" @click="clearSelection()"
                                title="Deselect (Esc)">×</button>
                    </div>
                    <div class="block-props__grid">
                        <div class="block-props__actions">
                            <button class="action-btn" @click="duplicateBlock()"
                                    title="Duplicate selected block(s) (Ctrl+D)">⧉ Duplicate</button>
                            <button class="action-btn copy-selection-btn" @click="copySelection()"
                                    title="Copy selected block(s) with their children to the clipboard as pseudo-graphic text">📋 Copy</button>
                            <button class="action-btn action-btn--danger"
                                    @click="deleteSelection()"
                                    title="Delete selected block(s) (Del)">✕ Delete</button>
                        </div>
                        <div class="prop prop--wide">
                            <span>Line Style</span>
                            <div class="style-btns">
                                <template x-for="s in borderStyles" :key="s">
                                    <button type="button" class="style-btn"
                                            :class="{ 'style-btn--active': styleActive(s) }"
                                            @click="updateSelectedBlock({ border_style: s })"
                                            :title="s" x-text="styleIcon(s)"></button>
                                </template>
                            </div>
                        </div>
                        <div class="prop-row">
                            <label class="prop prop--inline">
                                <span>X</span>
                                <input type="number" min="0" :value="selectedBlock.x"
                                       @change="updateSelectedXY($event)">
                            </label>
                            <label class="prop prop--inline">
                                <span>Y</span>
                                <input type="number" min="0" :value="selectedBlock.y"
                                       @change="updateSelectedXY($event)">
                            </label>
                            <label class="prop prop--inline">
                                <span>W</span>
                                <input type="number" min="1" :value="selectedBlock.width"
                                       @change="updateSelectedWH($event)">
                            </label>
                            <label class="prop prop--inline">
                                <span>H</span>
                                <input type="number" min="1" :value="selectedBlock.height"
                                       @change="updateSelectedWH($event)">
                            </label>
                        </div>
                        <label class="prop prop--wide" x-show="!isMultiSelect" x-cloak>
                            <span>Order</span>
                            <input type="number" min="0" :value="selectedBlock.order"
                                   @change="updateSelectedOrder($event)">
                        </label>
                        <label class="prop prop--wide">
                            <span>Content</span>
                            <input type="text" :value="selectedBlock.content"
                                   @change="updateSelectedContent($event)">
                        </label>
                    </div>
                </div>
                <!-- Inline content editor (opened by double-click on a block) -->
                <div class="block-edit-overlay" x-show="editingBlock" x-cloak
                     :style="editOverlayStyle">
                    <textarea x-ref="editInput" x-model="editText" spellcheck="false"
                              @keydown="onEditKeydown($event)"
                              @blur="saveBlockContent()"></textarea>
                </div>
            </div>
        </section>
    </div>
</div>

<script src="../js/alpine.min.js" defer></script>
<script src="../js/core/renderer.js"></script>
<script src="../js/core/store.js"></script>
<script src="../js/core/history.js"></script>
<script src="../js/core/import.js"></script>
<script src="../js/editor.js"></script>
</body>
</html>

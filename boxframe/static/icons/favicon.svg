<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background -->
  <rect width="64" height="64" rx="10" fill="#13131f"/>

  <!-- Outer frame (box-drawing style) -->
  <rect x="6" y="6" width="52" height="52" rx="3" fill="none" stroke="#6b9ec4" stroke-width="2.5"/>

  <!-- Corner accents (┌┐└┘ hint) -->
  <line x1="6" y1="10" x2="6" y2="6" stroke="#8fbdd9" stroke-width="3" stroke-linecap="round"/>
  <line x1="6" y1="6" x2="10" y2="6" stroke="#8fbdd9" stroke-width="3" stroke-linecap="round"/>
  <line x1="58" y1="10" x2="58" y2="6" stroke="#8fbdd9" stroke-width="3" stroke-linecap="round"/>
  <line x1="58" y1="6" x2="54" y2="6" stroke="#8fbdd9" stroke-width="3" stroke-linecap="round"/>
  <line x1="6" y1="54" x2="6" y2="58" stroke="#8fbdd9" stroke-width="3" stroke-linecap="round"/>
  <line x1="6" y1="58" x2="10" y2="58" stroke="#8fbdd9" stroke-width="3" stroke-linecap="round"/>
  <line x1="58" y1="54" x2="58" y2="58" stroke="#8fbdd9" stroke-width="3" stroke-linecap="round"/>
  <line x1="58" y1="58" x2="54" y2="58" stroke="#8fbdd9" stroke-width="3" stroke-linecap="round"/>

  <!-- "box" monogram -->
  <text x="32" y="38" text-anchor="middle" font-family="Courier New, monospace" font-size="18" font-weight="bold" fill="#d4d4d4">box</text>

  <!-- Underscore cursor -->
  <rect x="23" y="42" width="18" height="2" rx="1" fill="#6b9ec4" opacity="0.7"/>
</svg>
